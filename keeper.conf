# Window Keeper settings. Lines starting with # are ignored.

# Local time (HH:MM, 24h) at which the day's first window should open.
# No ping is sent during the 5 hours before it, so a window opened late at night
# cannot shift the next day. A good value is 2.5 hours before you usually start work.
# Empty = no anchor: windows are chained around the clock from wherever the last one ended.
morning_anchor=

# Full path to the Claude Code executable. Empty = ~/.local/bin/claude(.exe), then PATH.
claude_path=
